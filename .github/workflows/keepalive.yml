name: Ping Supabase

# En palier gratuit, Supabase met en pause un projet inactif depuis 7 jours.
# Ce workflow appelle la RPC public.ping() tous les 3 jours pour l'éviter.
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   SUPABASE_URL       https://<projet>.supabase.co
#   SUPABASE_ANON_KEY  la clé anon (publique) du projet
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Appeler public.ping()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Secrets SUPABASE_URL / SUPABASE_ANON_KEY absents : ping ignoré."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
